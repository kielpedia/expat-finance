name: Claude

# Claude Code works on an issue when the `claude` label is added, and answers `@claude` in
# issue and PR comments (for follow-ups on its own PRs). Only people with write access can
# trigger it: the action checks this, and on a public repo only they can apply labels.
# Runs on GitHub-hosted runners only, never on a self-hosted one.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # One run per issue or PR at a time; a new request waits for the previous one.
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # So Claude can run the tests and ruff before it pushes.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock -r requirements-dev.txt

      - uses: anthropics/claude-code-action@v1
        with:
          # Uses the owner's Claude subscription (token from `claude setup-token`).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
