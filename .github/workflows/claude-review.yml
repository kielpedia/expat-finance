name: Claude review

# Opus reviews every PR from a claude/ branch (the agent's PRs) against the issue it fixes, on open
# and on each push. It can only comment: it has no tool to approve, so the owner's approval stays the
# gate (the main ruleset requires it). If it finds problems it asks the agent (claude.yml) to fix them,
# at most 2 times per PR; after that it hands the PR to the owner.
# Runs on GitHub-hosted runners only. Fork PRs never get secrets, and only the owner can push claude/ branches.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # A newer push makes an unfinished review stale.
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Count earlier rounds
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count() {
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
              --jq "[.[] | select(.user.login == \"claude[bot]\" and (.body | contains(\"$1\")))] | length" \
              | awk '{s += $1} END {print s + 0}'
          }
          fixes=$(count '<!-- claude-review-fix -->')
          echo "review=$(( $(count '<!-- claude-review -->') + 1 ))" >> "$GITHUB_OUTPUT"
          echo "fixes_left=$(( fixes >= 2 ? 0 : 2 - fixes ))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW ROUND: ${{ steps.rounds.outputs.review }}
            FIX REQUESTS LEFT: ${{ steps.rounds.outputs.fixes_left }}

            You are the reviewer for a PR written by another Claude agent. The PR branch is checked out.
            Read CLAUDE.md first; its rules are part of the review.

            1. Find the issue this PR fixes (its body says "fixes #N"; `gh issue view N`) and treat that
               issue as the spec: its acceptance criteria, the files it names, what it says not to touch.
            2. Review the diff (`gh pr diff`) for: does it meet the spec; correctness bugs; missing or weak
               tests for the new behaviour; anything that weakens the access guard in finapp/hosting.py;
               tax figures outside finapp/rules.py or without a source; a missing CHANGELOG "Unreleased"
               entry for a user-visible change; real financial data anywhere.
            3. Put specific problems as inline comments (mcp__github_inline_comment__create_inline_comment,
               confirmed: true). Skip style nits that ruff would catch and anything outside the diff.
            4. Post exactly one summary with `gh pr comment`. Its first line must be `<!-- claude-review -->`,
               then a line `**Review round ${{ steps.rounds.outputs.review }}: ready for the owner**` or
               `**Review round ${{ steps.rounds.outputs.review }}: changes needed**`, then a short list.
               - Ready: say what you checked. Do not ask anyone to fix anything.
               - Changes needed and FIX REQUESTS LEFT is above 0: put `<!-- claude-review-fix -->` on the
                 second line and end with `@claude please fix the points above and push to this branch.`
                 Ask only for real problems: a wrong result, a missed requirement, a missing test, a rule
                 broken. Never for preferences.
               - Changes needed and FIX REQUESTS LEFT is 0: no fix marker and no @claude; end with
                 "Out of automatic fix rounds; leaving this for the owner."
            Only post GitHub comments; never approve, request changes as a formal review, push, or merge.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Glob,Grep"
