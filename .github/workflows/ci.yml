name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock pytest
      - run: python -m pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock --no-deps --disable-pip

  image:
    # Builds the self-hosting image on every PR. Publishes `:main` and `:<sha>` from main, and `:pr-<n>` for PRs
    # from branches of this repo (fork PRs only build), which the owner's server runs as a throwaway preview.
    needs: [lint, test, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: finapp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name finapp -p 8501:8501 -e FINAPP_PROXY_SECRET="$(openssl rand -hex 32)" finapp:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8501/_stcore/health && exit 0; sleep 2; done
          docker logs finapp; exit 1
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Comment the preview link
        # PREVIEW_URL is a repository variable (Settings > Secrets and variables > Actions > Variables), e.g.
        # https://finapp-pr-{n}.example.org. Unset: no comment. The preview itself is private to the owner's network.
        if: env.PUBLISH == 'true' && github.event_name == 'pull_request' && vars.PREVIEW_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL_TEMPLATE: ${{ vars.PREVIEW_URL }}
        run: |
          url="${URL_TEMPLATE//\{n\}/$PR}"
          marker="<!-- preview-link -->"
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            echo "Preview link already posted"; exit 0
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$marker
          **Preview:** $url
          Updates within about 10 minutes of each push and is removed when the PR closes. Starts with an empty database; import the files in \`sample_data/\` to try it."
